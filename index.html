    </div>

    <!-- CET-6 菜单 -->
    <div class="menu" id="menuCet6">

      <a href="#/listen/LL1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 17v-5a9 9 0 0 1 18 0v5"/><path d="M21 18.5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 18.5a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>讲座听力</a>
      <div class="grp">效率工具</div>

      <a href="#/wrong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>错题本<span class="cnt" id="cWrong">0</span></a>
      <a href="#/stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>数据分析</a>
      <div class="grp">系统</div>
      <a href="#/import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>导入题目</a>
      <a href="#/settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</a>
    </div>

    <!-- 349 菜单 -->
    <div class="menu" id="menuPharm">
      <div class="grp">349 药学综合</div>
      <a href="#/p/home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 12h8v9h-8zM3 15h8v6H3z"/></svg>总览</a>
      <a href="#/p/note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 4a2 2 0 0 1 2-2h10l4 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>学霸笔记</a>
      <a href="#/p/recite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>带背<span class="cnt" id="cRecite">▶</span></a>
      <a href="#/p/mech"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h6M14 18h6"/><path d="M7 18a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM17 18a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M10 15c3-1 3-5 4-7"/></svg>反应机理</a>
      <a href="#/p/bank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>常考题</a>
      <div class="grp">效率工具</div>
      <a href="#/p/wrong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>错题本<span class="cnt" id="cPWrong">0</span></a>
      <a href="#/p/master"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>掌握度</a>
      <a href="#/p/star"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>我的收藏</a>
      <div class="grp">数据来源</div>
      <a href="#/p/about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01" stroke-linecap="round"/></svg>考试说明</a>
    </div>

    <div class="sidefoot">
      <div class="mini" id="sideFoot">提示全开 = 学得快<br>调到「模拟考试」= 检验真水平</div>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <div class="main">
    <header class="top">
      <button class="burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <div class="crumb" id="crumb">总览</div>
      <div class="topsp"></div>

      <div id="topCet6" class="toptools">
        <label class="switch" id="swHoverWrap">
          <input type="checkbox" id="swHover" onchange="CET6.toggleHover(this.checked)"><i></i>
          <span>划词提示</span>
        </label>
        <div class="tseg">
          <span>辅助</span>
          <select id="swAssist" onchange="CET6.setAssist(+this.value)">
            <option value="0">模拟考试</option>
            <option value="1">轻 · 方向</option>
            <option value="2">中 · 定位</option>
            <option value="3">强 · 全开</option>
          </select>
        </div>
        <label class="switch">
          <input type="checkbox" id="swInstant" onchange="CET6.toggleInstant(this.checked)"><i></i>
          <span>即时反馈</span>
        </label>
      </div>
      <div id="topPharm" class="toptools" style="display:none">
        <span class="pill n" id="pExam">349 · 300 分</span>
        <span class="pill" id="pMaster" title="掌握度">掌握度 —</span>
        <a class="pill" href="#/p/wrong" id="pWrong" title="错题本" style="text-decoration:none">错题 0</a>
      </div>
      <span class="kbtn" onclick="event.stopPropagation();CET6.TOOLS.kbd()" title="快捷键（?）">?</span>
    </header>

    <div class="content" id="app"></div>
  </div>
</div>

<div id="tip" style="display:none"></div>
<div id="selbar" style="display:none">
  <button data-a="word" onclick="CET6.TOOLS.addSel()">收词</button>
  <button data-a="tr" onclick="CET6.TOOLS.translateSel()">翻译</button>
  <button data-a="cp" onclick="CET6.TOOLS.selCopy()">复制</button>
  <button data-a="x" onclick="CET6.hideSelBar()">✕</button>
</div>
<div id="trans">
  <div class="lbl">译文 <span id="ttx" style="display:none">· <a href="javascript:void(0)" onclick="CET6.TOOLS.clearTrans()">清空</a></span></div>
  <div id="tt" class="empty">把鼠标移到任意句子上，这里显示整句翻译；<b>划选一段</b>可整段翻译</div>
</div>
<div id="toast"></div>
<div id="kbd">
  <div class="box" onclick="event.stopPropagation()">
    <h3>快捷键</h3>
    <p class="sub" style="margin:0 0 10px">每一行都能直接<b>点着执行</b>——不想记快捷键就当操作面板用。</p>
    <div id="kbdBody"></div>
    <div style="margin-top:16px;text-align:right"><button class="primary sm" onclick="CET6.TOOLS.kbdClose()">知道了</button></div>
  </div>
</div>

<script src="js/dict.js"></script>
<script src="js/bank-reading.js"></script>
<script src="js/bank-other.js"></script>
<script src="js/assess.js"></script>
<script src="js/core.js"></script>
<script src="js/stats.js"></script>
<script src="js/tools.js"></script>
<script src="js/import.js"></script>
<script src="js/pharm-org1.js"></script>
<script src="js/pharm-org2.js"></script>
<script src="js/pharm-org3.js"></script>
<script src="js/pharm-ana.js"></script>
<script src="js/pharm-bio.js"></script>
<script src="js/recite.js"></script>
<script src="js/pharm-stat.js"></script>
<script src="js/pharm.js"></script>
<script src="js/app.js"></script>
<script>
  (function(){
    var s = CET6.settings;
    var h = document.getElementById('swHover'); if(h) h.checked = s.hoverTip;
    var i = document.getElementById('swInstant'); if(i) i.checked = s.instant;
    var a = document.getElementById('swAssist'); if(a) a.value = String(s.assist);
    var hw = document.getElementById('swHoverWrap'); if(hw && s.hoverTip) hw.classList.add('on');
    CET6.syncTop();
    CET6.TOOLS.refreshBadges();
  })();
</script>
</body>
</html>
